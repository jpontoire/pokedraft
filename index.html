<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poke Game Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="portal">
        <button id="lang-toggle" type="button" class="pixel-btn lang-toggle-btn">EN</button>
        <h1 class="portal-title" data-i18n="portalTitle">PokeDraft Portal</h1>
        <p class="portal-subtitle" data-i18n="portalSubtitle">Choose a game to play</p>

        <div class="portal-menu">
            <a href="./draft/" class="pixel-btn portal-btn" data-i18n="playDraft">Play PokeDraft</a>
            <a href="./zoom/" class="pixel-btn portal-btn" data-i18n="playZoom">Play PokeZoom</a>
            <a href="./dex/" class="pixel-btn portal-btn" data-i18n="playDex">Play DexGuess</a>
        </div>
    </div>

    <script src="translations/portal.js"></script>
    <script src="app.js"></script>
</body>
</html>

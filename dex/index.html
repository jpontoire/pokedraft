<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DexGuess</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <a href="../" class="pixel-btn back-to-portal-btn" data-i18n="backToMenu">< Menu</a>
        <button id="lang-toggle" type="button" class="pixel-btn lang-toggle-btn">EN</button>
        <h1 class="app-title">DexGuess</h1>

        <div id="description-box" class="description-box">
            <p id="description-text"></p>
        </div>

        <div id="sprite-container" class="sprite-container hidden">
            <img id="sprite-image" class="sprite-image" src="" alt="">
        </div>

        <div id="hints-container" class="hints-container hidden">
            <div id="hint-types" class="hint hidden">
                <p class="hint-label" data-i18n="hintTypesLabel">Hint 1: Types</p>
                <p id="hint-types-value" class="hint-value"></p>
            </div>
            <div id="hint-color" class="hint hidden">
                <p class="hint-label" data-i18n="hintColorLabel">Hint 2: Color &amp; Size</p>
                <p id="hint-color-value" class="hint-value"></p>
            </div>
            <div id="hint-cry" class="hint hidden">
                <p class="hint-label" data-i18n="hintCryLabel">Hint 3: Cry</p>
                <div id="hint-cry-content"></div>
            </div>
        </div>

        <form id="guess-form" class="guess-form">
            <input id="guess-input" class="pixel-input" type="text" list="pokemon-names" data-i18n-placeholder="guessPlaceholder" placeholder="Who's that Pokemon?" autocomplete="off">
            <datalist id="pokemon-names"></datalist>
            <button type="submit" class="pixel-btn" data-i18n="submit">Submit</button>
        </form>

        <button id="next-btn" class="pixel-btn hidden" data-i18n="nextPokemon">Next Pokemon</button>

        <footer id="dialogue-box" class="dialogue-box">
            <p id="dialogue-text" data-i18n="dlgLoading">Loading Pokemon data...</p>
        </footer>
    </div>

    <script src="../translations/shared.js"></script>
    <script src="../translations/dex.js"></script>
    <script src="app.js"></script>
</body>
</html>

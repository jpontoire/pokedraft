<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeDraft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <a href="../" class="pixel-btn back-to-portal-btn" data-i18n="backToMenu">< Menu</a>
        <button id="lang-toggle" type="button" class="pixel-btn lang-toggle-btn">EN</button>
        <h1 class="app-title">PokeDraft</h1>

        <div id="app-layout">
            <div id="my-team-panel" class="team-panel side-panel hidden">
                <p class="team-panel-title" data-i18n="yourTeam">Your Team</p>
                <div id="my-team-slots" class="team-slots"></div>
            </div>

            <div id="main-column">
                <!-- Lobby Screen -->
                <section id="lobby-screen" class="screen">
                    <div class="lobby-menu">
                        <button id="host-btn" class="pixel-btn" data-i18n="hostGame">Host Game</button>
                        <button id="join-btn" class="pixel-btn" data-i18n="joinGame">Join Game</button>
                        <div id="join-form" class="join-form hidden">
                            <input id="join-room-input" type="text" class="pixel-input" data-i18n-placeholder="roomIdPlaceholder" placeholder="Room ID">
                            <button id="join-confirm-btn" class="pixel-btn" data-i18n="connect">Connect</button>
                        </div>
                    </div>
                </section>

                <!-- Settings Screen -->
                <section id="settings-screen" class="screen hidden">
                    <div id="host-settings-form" class="settings-form hidden">
                        <h2 class="settings-title" data-i18n="gameSettings">Game Settings</h2>

                        <div class="settings-group">
                            <p class="settings-label" data-i18n="allowedGenerations">Allowed Generations</p>
                            <div id="generation-checkboxes" class="generation-checkboxes">
                                <label class="checkbox-option"><input type="checkbox" value="1" checked> <span data-i18n="gen">Gen</span> 1</label>
                                <label class="checkbox-option"><input type="checkbox" value="2" checked> <span data-i18n="gen">Gen</span> 2</label>
                                <label class="checkbox-option"><input type="checkbox" value="3" checked> <span data-i18n="gen">Gen</span> 3</label>
                                <label class="checkbox-option"><input type="checkbox" value="4" checked> <span data-i18n="gen">Gen</span> 4</label>
                                <label class="checkbox-option"><input type="checkbox" value="5" checked> <span data-i18n="gen">Gen</span> 5</label>
                                <label class="checkbox-option"><input type="checkbox" value="6" checked> <span data-i18n="gen">Gen</span> 6</label>
                                <label class="checkbox-option"><input type="checkbox" value="7" checked> <span data-i18n="gen">Gen</span> 7</label>
                                <label class="checkbox-option"><input type="checkbox" value="8" checked> <span data-i18n="gen">Gen</span> 8</label>
                                <label class="checkbox-option"><input type="checkbox" value="9" checked> <span data-i18n="gen">Gen</span> 9</label>
                            </div>
                        </div>

                        <div class="settings-group">
                            <p class="settings-label" data-i18n="legendariesSettings">Legendaries Settings</p>
                            <div class="stat-input-row">
                                <label><span data-i18n="min">Min</span> <input type="number" id="legendary-min" class="pixel-number-input" min="0" max="6" value="0"></label>
                                <label><span data-i18n="max">Max</span> <input type="number" id="legendary-max" class="pixel-number-input" min="0" max="6" value="1"></label>
                            </div>
                            <label class="checkbox-option"><input type="checkbox" id="symmetrical-legendaries" checked> <span data-i18n="symmetricalLegendaries">Symmetrical Legendaries</span></label>
                        </div>

                        <div class="settings-group">
                            <p class="settings-label" data-i18n="mythicalsSettings">Mythicals Settings</p>
                            <div class="stat-input-row">
                                <label><span data-i18n="min">Min</span> <input type="number" id="mythical-min" class="pixel-number-input" min="0" max="6" value="0"></label>
                                <label><span data-i18n="max">Max</span> <input type="number" id="mythical-max" class="pixel-number-input" min="0" max="6" value="0"></label>
                            </div>
                            <label class="checkbox-option"><input type="checkbox" id="symmetrical-mythicals" checked> <span data-i18n="symmetricalMythicals">Symmetrical Mythicals</span></label>
                        </div>

                        <div class="settings-group">
                            <label for="clue-select" class="settings-label" data-i18n="blindPickerClue">Blind Picker Clue</label>
                            <select id="clue-select" class="pixel-select">
                                <option value="types" data-i18n="clueTypes">Types</option>
                                <option value="color" data-i18n="clueColor">Color</option>
                                <option value="shape" data-i18n="clueShape">Shape</option>
                                <option value="height_weight" data-i18n="clueHeightWeight">Height / Weight</option>
                                <option value="pokedex_num" data-i18n="cluePokedexNum">Pokedex Number</option>
                                <option value="base_stats" data-i18n="clueBaseStats">Base Stats</option>
                                <option value="total_stats" data-i18n="clueTotalStats">Total Base Stats</option>
                                <option value="cry" data-i18n="clueCry">Pokémon Cry (Audio)</option>
                            </select>
                        </div>

                        <button id="start-draft-btn" class="pixel-btn" data-i18n="startDraft">Start Draft</button>
                    </div>

                    <div id="guest-settings-loading" class="settings-loading hidden">
                        <div class="loading-pokeball"></div>
                    </div>
                </section>

                <!-- Game Screen -->
                <section id="game-screen" class="screen hidden">
                    <div id="room-id-bar" class="room-id-bar hidden">
                        <span id="room-id-text" class="room-id-text"></span>
                        <button id="copy-id-btn" class="pixel-btn small-btn" data-i18n="copy">Copy</button>
                    </div>
                    <p id="turn-info" class="turn-info"></p>
                    <div id="lab-desk" class="lab-desk"></div>
                </section>

                <!-- Dialogue Box -->
                <footer id="dialogue-box" class="dialogue-box">
                    <div class="dialogue-content">
                        <p id="dialogue-text" data-i18n="dlgWelcome">Welcome, Trainer! Host or join a game to begin.</p>
                        <div class="dialogue-actions">
                            <button id="next-turn-btn" class="pixel-btn hidden" data-i18n="nextTurn">Next Turn</button>
                            <button id="export-btn" class="pixel-btn hidden" data-i18n="exportTeam">Export Team to Showdown</button>
                        </div>
                    </div>
                </footer>
            </div>

            <div id="opponent-team-panel" class="team-panel side-panel hidden">
                <p class="team-panel-title" data-i18n="opponentTeam">Opponent Team</p>
                <div id="opponent-team-slots" class="team-slots"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="app.js"></script>
</body>
</html>

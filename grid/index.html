<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeGrid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <a href="../" class="pixel-btn back-to-portal-btn" data-i18n="backToMenu">< Menu</a>
        <button id="lang-toggle" type="button" class="pixel-btn lang-toggle-btn">EN</button>
        <h1 class="app-title">PokeGrid</h1>

        <form id="guess-form" class="guess-form">
            <div class="autocomplete-wrapper">
                <input id="guess-input" class="pixel-input" type="text" data-i18n-placeholder="guessPlaceholder" placeholder="Who's that Pokemon?" autocomplete="off">
                <ul id="guess-suggestions" class="autocomplete-list hidden"></ul>
            </div>
            <button type="submit" class="pixel-btn" data-i18n="submit">Submit</button>
        </form>

        <div class="grid-scroll-wrapper">
            <div id="grid-table" class="grid-table">
                <div class="grid-row grid-header">
                    <span class="grid-cell grid-header-cell" data-i18n="colSprite">Sprite</span>
                    <span class="grid-cell grid-header-cell" data-i18n="colType1">Type 1</span>
                    <span class="grid-cell grid-header-cell" data-i18n="colType2">Type 2</span>
                    <span class="grid-cell grid-header-cell" data-i18n="colHabitat">Habitat</span>
                    <span class="grid-cell grid-header-cell" data-i18n="colColor">Color</span>
                    <span class="grid-cell grid-header-cell" data-i18n="colGeneration">Gen</span>
                    <span class="grid-cell grid-header-cell" data-i18n="colEvoStage">Evo Stage</span>
                    <span class="grid-cell grid-header-cell" data-i18n="colHeight">Height</span>
                    <span class="grid-cell grid-header-cell" data-i18n="colWeight">Weight</span>
                </div>
                <div id="grid-body" class="grid-body"></div>
            </div>
        </div>

        <button id="next-btn" class="pixel-btn hidden" data-i18n="playAgain">Play Again</button>

        <footer id="dialogue-box" class="dialogue-box">
            <p id="dialogue-text" data-i18n="dlgLoading">Loading Pokemon data...</p>
        </footer>
    </div>

    <script src="../translations/shared.js"></script>
    <script src="../translations/grid.js"></script>
    <script src="../autocomplete.js"></script>
    <script src="app.js"></script>
</body>
</html>
